<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能點名系統 (全動態修復 + 圖片辨識版)</title>
    <!-- 引入 SheetJS 處理 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 引入 Tesseract.js 處理圖片 OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; max-width: 1200px; margin: 0 auto; background-color: #f4f6f9; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; font-size: 22px; }
        .control-group { margin-bottom: 12px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; font-size: 14px; }
        select, input[type="file"], input[type="text"], button { padding: 8px 10px; width: 100%; box-sizing: border-box; margin-bottom: 8px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; }
        
        /* 側邊欄與工作區版面配置 */
        .workspace-layout { display: flex; gap: 15px; align-items: flex-start; }
        .class-sidebar { width: 170px; min-width: 170px; background: white; padding: 10px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .class-sidebar h3 { font-size: 14px; margin-top: 0; margin-bottom: 8px; color: #2c3e50; border-bottom: 2px solid #0366d6; padding-bottom: 4px; }
        .class-filter-btn { display: block; width: 100%; text-align: left; margin-bottom: 5px; padding: 7px 9px; font-size: 13px; border-radius: 5px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .class-filter-btn:hover { background-color: #eef5ff; border-color: #70a5e6; }
        .class-filter-btn.active { background-color: #0366d6; color: white; border-color: #0366d6; font-weight: bold; }
        .table-container { flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; }

        .date-bar { display: flex; gap: 10px; align-items: center; background: #eef5ff; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .date-bar select { margin-bottom: 0; font-weight: bold; color: #0366d6; flex: 1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; background: white; }
        th, td { border: 1px solid #e0e0e0; padding: 6px 4px; text-align: center; }
        th { background-color: #f8f9fa; color: #495057; font-size: 13px; }

        /* 放學方式標籤 */
        .tag-dismiss { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .tag-walk { background-color: #e3f2fd; color: #0d47a1; }
        .tag-parent { background-color: #f3e5f5; color: #4a148c; }
        .tag-both { background-color: #e8f5e9; color: #1b5e20; }
        .tag-none { background-color: #f5f5f5; color: #757575; }

        /* 按鈕樣式 */
        .day-toggle-group { display: inline-flex; gap: 2px; }
        .day-btn { padding: 3px 5px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; border-radius: 3px; font-size: 11px; color: #666; margin-bottom: 0; width: auto; }
        .day-btn.selected { background-color: #dc3545; color: white; border-color: #dc3545; font-weight: bold; }

        .status-btn-group { display: inline-flex; gap: 3px; }
        .status-btn { padding: 6px 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 12px; margin-bottom: 0; width: auto; font-weight: bold; }
        .status-btn.active-present { background-color: #28a745; color: white; border-color: #28a745; }
        .status-btn.active-absent { background-color: #dc3545; color: white; border-color: #dc3545; }
        .status-btn.active-leave { background-color: #ffc107; color: #212529; border-color: #ffc107; }
        .status-btn.active-late { background-color: #17a2b8; color: white; border-color: #17a2b8; }

        .btn-edit { background-color: #6f42c1; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; width: auto; margin-bottom: 0; }

        .summary-info { font-size: 13px; color: #666; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;}
        .action-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;}
        .add-student-btn { background-color: #0366d6; color: white; font-weight: bold; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; width: auto; margin-bottom: 0; }

        .export-btn { background-color: #28a745; color: white; font-weight: bold; border: none; font-size: 15px; margin-top: 12px; cursor: pointer; padding: 10px; }
        .reset-btn { background-color: #6c757d; color: white; font-weight: bold; border: none; font-size: 12px; padding: 5px 10px; width: auto; margin-bottom: 0; cursor: pointer; }
        
        .save-tag { font-size: 12px; color: #28a745; font-weight: bold; display: none; }
        .tips { color: #555; font-size: 12px; line-height: 1.4; background: #eef5ff; padding: 8px; border-radius: 5px; margin-top: 5px; }

        /* OCR UI 樣式 */
        .ocr-section { background: #fcf8e3; padding: 12px; border-radius: 6px; border: 1px solid #faebcc; margin-bottom: 12px; }
        .ocr-status { font-size: 13px; font-weight: bold; margin-top: 5px; display: none; }
        .ocr-file-input { margin-bottom: 0 !important; background: white; }

        /* Modal 彈出視窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 18px; border-radius: 8px; width: 340px; max-width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-box h3 { margin-top: 0; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 16px; }
        .checkbox-group { display: flex; gap: 15px; margin-bottom: 12px; align-items: center; }
        .checkbox-group label { font-weight: normal; margin-bottom: 0; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .checkbox-group input { width: auto; margin-bottom: 0; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; align-items: center; }
        .modal-btns button { width: auto; padding: 6px 12px; margin-bottom: 0; font-size: 13px; cursor: pointer; }
        .btn-confirm { background-color: #28a745; color: white; border: none; font-weight: bold; }
        .btn-cancel { background-color: #6c757d; color: white; border: none; }
        .btn-delete { background-color: #dc3545; color: white; border: none; font-weight: bold; margin-right: auto; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .card { padding: 10px; }
            .workspace-layout { flex-direction: column; gap: 10px; }
            .class-sidebar { width: 100%; min-width: 100%; box-sizing: border-box; padding: 8px; }
            .class-sidebar h3 { font-size: 13px; margin-bottom: 5px; }
            #classSidebarList { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 5px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
            .class-filter-btn { width: auto; flex: 0 0 auto; margin-bottom: 0; font-size: 12px; padding: 5px 10px; }
            th, td { padding: 5px 2px; }
            .status-btn { padding: 5px 6px; font-size: 11px; }
            .day-btn { padding: 2px 3px; font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>📝 智能點名系統</h1>
    
    <div class="control-group" id="uploadSection">
        <label for="excelFile">1. 匯入 Excel 點名紙：</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls" multiple>
        <div class="tips">
            ✨ <b>全動態標籤修復版：</b> 自動精準辨識欄位座標，解決匯出檔案再重新匯入時「訓練日期變少」及「遺漏學生」的問題。
        </div>
    </div>

    <!-- 點名工作區 -->
    <div id="appWorkspace" style="display: none;">
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <div class="control-group">
            <label>2. 選擇訓練日期進行點名：</label>
            <div class="date-bar">
                <select id="dateSelect"></select>
                <span id="weekdayTag" style="font-weight: bold; color: #555; min-width: 65px;"></span>
            </div>
        </div>

        <div class="summary-info">
            <div>訓練項目：<strong id="activityDisplay" style="color:#0366d6;">-</strong> | 人數：<strong id="studentCount">0</strong></div>
            <div>
                <span id="saveStatus" class="save-tag">✓ 已自動儲存</span>
                <button type="button" class="reset-btn" id="resetBtn">清除重匯</button>
            </div>
        </div>

        <!-- 圖片上載 OCR 區塊 -->
        <div class="ocr-section">
            <label for="imageUpload">📸 3. 自動辨識缺席名單 (上載圖片)：</label>
            <input type="file" id="imageUpload" class="ocr-file-input" accept="image/*" multiple>
            <div id="ocrStatus" class="ocr-status"></div>
            <div class="tips" style="background: transparent; padding: 0; margin-top: 4px; color: #8a6d3b;">
                💡 支援多次上載，可選取多張圖片。系統會讀取圖片文字，若與系統姓名匹配，將於<b>當日自動標記為缺席</b>。首次辨識需載入語系模組，請稍候。
            </div>
        </div>

        <div class="action-bar">
            <button type="button" class="add-student-btn" onclick="openStudentModal(-1)">➕ 新增學生</button>
        </div>

        <div class="workspace-layout">
            <div class="class-sidebar">
                <h3>🔍 班別快速篩選</h3>
                <div id="classSidebarList"></div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 6%;">班別</th>
                            <th style="width: 6%;">學號</th>
                            <th style="width: 14%;">學生姓名</th>
                            <th style="width: 10%;">放學方式</th>
                            <th style="width: 30%;">當日點名狀態</th>
                            <th style="width: 26%;">個人固定缺席日</th>
                            <th style="width: 8%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>

        <button type="button" class="export-btn" id="exportBtn">匯出原格式 Excel 點名紙</button>
    </div>
</div>

<!-- 新增/編輯學生 Modal -->
<div class="modal-overlay" id="studentModal">
    <div class="modal-box">
        <h3 id="modalTitle">➕ 新增學生資料</h3>
        
        <div class="control-group">
            <label for="modalClass">班別：</label>
            <input type="text" id="modalClass" placeholder="例如: 1A">
        </div>
        
        <div class="control-group">
            <label for="modalId">學號：</label>
            <input type="text" id="modalId" placeholder="例如: 01">
        </div>

        <div class="control-group">
            <label for="modalName">學生姓名：</label>
            <input type="text" id="modalName" placeholder="例如: 陳大文">
        </div>

        <div class="control-group">
            <label>放學方式：</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="modalWalk"> 先行</label>
                <label><input type="checkbox" id="modalParent"> 家長</label>
            </div>
        </div>

        <div class="modal-btns">
            <button type="button" class="btn-delete" id="btnDelete" onclick="deleteStudent()">🗑️ 刪除學生</button>
            <button type="button" class="btn-cancel" onclick="closeStudentModal()">取消</button>
            <button type="button" class="btn-confirm" onclick="saveStudent()">儲存</button>
        </div>
    </div>
</div>

<script>
    let rawStudents = [];     
    let dateList = [];        
    let activityName = "";    
    let attendanceMap = {};   
    let currentClassFilter = "ALL"; 
    let editingStudentIndex = -1;  

    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const weekdayLabels = [
        { num: 1, label: "一" },
        { num: 2, label: "二" },
        { num: 3, label: "三" },
        { num: 4, label: "四" },
        { num: 5, label: "五" },
        { num: 6, label: "六" },
        { num: 0, label: "日" }
    ];

    const LOCAL_STORAGE_KEY = "SMART_ROLLCALL_DATA_V10";

    const excelFileInput = document.getElementById('excelFile');
    const appWorkspace = document.getElementById('appWorkspace');
    const dateSelect = document.getElementById('dateSelect');
    const weekdayTag = document.getElementById('weekdayTag');
    const studentTableBody = document.getElementById('studentTableBody');
    const activityDisplay = document.getElementById('activityDisplay');
    const studentCount = document.getElementById('studentCount');
    const saveStatus = document.getElementById('saveStatus');
    const classSidebarList = document.getElementById('classSidebarList');

    const imageUpload = document.getElementById('imageUpload');
    const ocrStatus = document.getElementById('ocrStatus');

    window.addEventListener('DOMContentLoaded', loadDataFromStorage);

    function sanitizeStr(val) {
        if (val === null || val === undefined) return "";
        return val.toString().trim().replace(/[\r\n]+/g, ' ');
    }

    function formatDateCell(val) {
        if (val === null || val === undefined) return "";
        
        if (val instanceof Date) {
            if (isNaN(val.getTime())) return "";
            let y = val.getFullYear();
            let m = String(val.getMonth() + 1).padStart(2, '0');
            let d = String(val.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        
        let str = val.toString().trim().replace(/[\r\n]+/g, ' ');
        if (!str) return "";

        let match = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (match) {
            let y = match[1];
            let m = String(match[2]).padStart(2, '0');
            let d = String(match[3]).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        let dObj = new Date(str);
        if (!isNaN(dObj.getTime())) {
            let y = dObj.getFullYear();
            let m = String(dObj.getMonth() + 1).padStart(2, '0');
            let d = String(dObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        return "";
    }

    function getDayOfWeek(dateStr) {
        if (!dateStr) return -1;
        const parts = dateStr.split('-').map(p => parseInt(p, 10));
        if (parts.length === 3 && !parts.some(isNaN)) {
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            return dateObj.getDay();
        }
        return -1;
    }

    function sortStudents() {
        rawStudents.sort((a, b) => {
            const cComp = (a.class || "").localeCompare(b.class || "", 'zh-HK', { numeric: true });
            if (cComp !== 0) return cComp;
            return (a.studentId || "").localeCompare(b.studentId || "", 'zh-HK', { numeric: true });
        });
    }

    function autoSave() {
        const storeObj = {
            rawStudents,
            dateList,
            activityName,
            attendanceMap,
            selectedDate: dateSelect.value,
            currentClassFilter
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(storeObj));
        saveStatus.style.display = "inline";
        setTimeout(() => { saveStatus.style.display = "none"; }, 1500);
    }

    function loadDataFromStorage() {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!saved) return;

        try {
            const data = JSON.parse(saved);
            rawStudents = data.rawStudents || [];
            dateList = data.dateList || [];
            activityName = data.activityName || "";
            attendanceMap = data.attendanceMap || {};
            if (data.currentClassFilter) currentClassFilter = data.currentClassFilter;

            if (rawStudents.length > 0 && dateList.length > 0) {
                sortStudents();
                activityDisplay.textContent = activityName;
                studentCount.textContent = rawStudents.length;

                dateSelect.innerHTML = "";
                dateList.forEach((d, idx) => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    const wNum = getDayOfWeek(d);
                    const wStr = wNum !== -1 ? weekdays[wNum] : "";
                    opt.textContent = `第 ${idx + 1} 節：${d} (${wStr})`;
                    dateSelect.appendChild(opt);
                });

                if (data.selectedDate) dateSelect.value = data.selectedDate;

                appWorkspace.style.display = 'block';
                renderClassSidebar();
                renderRollCallTable();
            }
        } catch(e) {
            console.error("載入舊資料失敗:", e);
        }
    }

    // 全動態 Excel 解析邏輯
    excelFileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        let allDatesSet = new Set();
        let studentMap = new Map();
        let primaryActivityName = "";
        let importedAttendance = {};

        const readPromises = files.map((file, index) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const aoa = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});

                    let headerRowIdx = -1;
                    let nameCol = -1, classCol = -1, idCol = -1, walkCol = -1, parentCol = -1;

                    for (let r = 0; r < aoa.length; r++) {
                        if (!aoa[r]) continue;
                        for (let c = 0; c < aoa[r].length; c++) {
                            let text = sanitizeStr(aoa[r][c]);
                            if (text.includes("姓名") || text.includes("人名")) {
                                headerRowIdx = r;
                                nameCol = c;
                                break;
                            }
                        }
                        if (headerRowIdx !== -1) break;
                    }

                    if (headerRowIdx === -1) {
                        alert("匯入失敗：無法在 Excel 找到包含「學生姓名」的表頭列。");
                        resolve();
                        return;
                    }

                    let headerRow = aoa[headerRowIdx];

                    for (let c = 0; c < headerRow.length; c++) {
                        let text = sanitizeStr(headerRow[c]);
                        if (text.includes("班")) classCol = c;
                        else if (text.includes("學號") || text.includes("號")) idCol = c;
                        else if (text.includes("先行")) walkCol = c;
                        else if (text.includes("家長")) parentCol = c;
                    }

                    let dateCols = [];
                    for (let c = 0; c < headerRow.length; c++) {
                        if (c === nameCol || c === classCol || c === idCol || c === walkCol || c === parentCol) continue;
                        let dVal = formatDateCell(headerRow[c]);
                        if (dVal !== "") {
                            allDatesSet.add(dVal);
                            dateCols.push({ colIdx: c, dateStr: dVal });
                        }
                    }

                    if (index === 0) {
                        for (let r = 0; r < headerRowIdx; r++) {
                            if (aoa[r]) {
                                for (let c = 0; c < aoa[r].length; c++) {
                                    let text = sanitizeStr(aoa[r][c]);
                                    if (text && !text.includes("班別") && !text.includes("學號")) {
                                        primaryActivityName = text;
                                        break;
                                    }
                                }
                            }
                            if (primaryActivityName) break;
                        }
                        if (!primaryActivityName) primaryActivityName = "訓練活動";
                    }

                    for (let r = headerRowIdx + 1; r < aoa.length; r++) {
                        if (!aoa[r] || nameCol >= aoa[r].length) continue;

                        let sName = sanitizeStr(aoa[r][nameCol]);
                        if (!sName) continue;

                        let sClass = classCol !== -1 && classCol < aoa[r].length ? sanitizeStr(aoa[r][classCol]) : "";
                        let sId = idCol !== -1 && idCol < aoa[r].length ? sanitizeStr(aoa[r][idCol]) : "";
                        let sKey = `${sClass}_${sId}_${sName}`;

                        let valWalk = walkCol !== -1 && walkCol < aoa[r].length ? sanitizeStr(aoa[r][walkCol]) : "";
                        let valParent = parentCol !== -1 && parentCol < aoa[r].length ? sanitizeStr(aoa[r][parentCol]) : "";

                        let isWalk = valWalk !== "" && valWalk !== "0";
                        let isParent = valParent !== "" && valParent !== "0";
                        let dismissType = "未註明";
                        if (isWalk && isParent) dismissType = "先行/家長";
                        else if (isWalk) dismissType = "先行";
                        else if (isParent) dismissType = "家長";

                        if (!studentMap.has(sKey)) {
                            studentMap.set(sKey, {
                                key: sKey,
                                class: sClass,
                                studentId: sId,
                                name: sName,
                                dismissMethod: dismissType,
                                hasWalk: isWalk,
                                hasParent: isParent,
                                fixedAbsentDays: []
                            });
                        }

                        dateCols.forEach(dObj => {
                            let statusVal = dObj.colIdx < aoa[r].length ? sanitizeStr(aoa[r][dObj.colIdx]) : "";
                            if (!statusVal) statusVal = "出席";
                            importedAttendance[`${dObj.dateStr}_${sKey}`] = statusVal;
                        });
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        });

        Promise.all(readPromises).then(() => {
            activityName = primaryActivityName;
            activityDisplay.textContent = activityName;

            dateList = Array.from(allDatesSet).sort((a, b) => new Date(a) - new Date(b));
            rawStudents = Array.from(studentMap.values());
            sortStudents();
            studentCount.textContent = rawStudents.length;

            attendanceMap = {};
            dateList.forEach(d => {
                rawStudents.forEach(s => {
                    const key = `${d}_${s.key}`;
                    attendanceMap[key] = importedAttendance[key] || "出席";
                });
            });

            dateSelect.innerHTML = "";
            dateList.forEach((d, idx) => {
                const opt = document.createElement('option');
                opt.value = d;
                const wNum = getDayOfWeek(d);
                const wStr = wNum !== -1 ? weekdays[wNum] : "";
                opt.textContent = `第 ${idx + 1} 節：${d} (${wStr})`;
                dateSelect.appendChild(opt);
            });

            currentClassFilter = "ALL";
            appWorkspace.style.display = 'block';
            renderClassSidebar();
            renderRollCallTable();
            autoSave();
        });
    });

    dateSelect.addEventListener('change', () => {
        renderRollCallTable();
        autoSave();
    });

    // 圖像預處理：自動加白邊以保護邊緣文字
    function preprocessImageForOCR(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const padding = 50; // 加 50px 白邊防貼邊
                
                canvas.width = img.width + padding * 2;
                canvas.height = img.height + padding * 2;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, padding, padding);

                resolve(canvas.toDataURL());
            };
        });
    }

    // 精確與連續視窗比對演算法（徹底解決散落單字誤判問題）
    function isStudentMatched(studentName, ocrText) {
        const cleanName = studentName.replace(/\s+/g, '');
        if (!cleanName || cleanName.length < 2) return false;

        // 1. 完全精準字串比對
        if (ocrText.includes(cleanName)) return true;

        // 2 字姓名：強制 100% 完全精準匹配，拒絕模糊容錯以防大面積誤判
        if (cleanName.length < 3) return false;

        // 3 字或以上姓名：使用滑動視窗比對連續文字，最多僅容許 1 個錯別字
        const nameLen = cleanName.length;
        for (let i = 0; i <= ocrText.length - nameLen; i++) {
            const windowSub = ocrText.substr(i, nameLen);
            let matchCount = 0;
            for (let j = 0; j < nameLen; j++) {
                if (windowSub[j] === cleanName[j]) {
                    matchCount++;
                }
            }
            if (matchCount >= nameLen - 1) {
                return true;
            }
        }
        return false;
    }

    // 升級版圖片上載 OCR 處理
    imageUpload.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const selectedDate = dateSelect.value;
        if (!selectedDate) {
            alert("請先在步驟 2 選擇需要標記缺席的訓練日期！");
            imageUpload.value = "";
            return;
        }

        ocrStatus.style.display = 'block';
        ocrStatus.innerHTML = `<span style="color:#d35400;">⏳ 系統正在讀取並分析圖片...</span>`;
        
        let foundNames = new Set();

        try {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                ocrStatus.innerHTML = `<span style="color:#d35400;">⏳ 正在分析第 ${i + 1}/${files.length} 張圖片...</span>`;
                
                // 1. 進行圖像預處理（加白邊）
                const processedImageData = await preprocessImageForOCR(file);

                // 2. 執行 Tesseract OCR
                const { data: { text } } = await Tesseract.recognize(
                    processedImageData,
                    'chi_tra+eng',
                    { logger: m => {
                        if (m.status === 'recognizing text') {
                            ocrStatus.innerHTML = `<span style="color:#d35400;">⏳ 正在分析第 ${i + 1}/${files.length} 張圖片 (進度: ${Math.round(m.progress * 100)}%)...</span>`;
                        }
                    }}
                );
                
                // 清除換行與標點符號，保留純文字串
                const cleanText = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');

                rawStudents.forEach(student => {
                    if (isStudentMatched(student.name, cleanText)) {
                        attendanceMap[`${selectedDate}_${student.key}`] = "缺席";
                        foundNames.add(student.name);
                    }
                });
            }
            
            if (foundNames.size > 0) {
                ocrStatus.innerHTML = `<span style="color:#28a745;">✅ 分析完成！已精準將以下 ${foundNames.size} 位學生於 ${selectedDate} 標記為「缺席」：<br>${Array.from(foundNames).join('、')}</span>`;
                renderRollCallTable();
                autoSave();
            } else {
                ocrStatus.innerHTML = `<span style="color:#dc3545;">⚠️ 分析完成，未找到符合名單。請確認截圖是否清晰。</span>`;
            }
        } catch (error) {
            console.error(error);
            ocrStatus.innerHTML = `<span style="color:#dc3545;">❌ 分析圖片時發生錯誤。</span>`;
        }

        imageUpload.value = "";
    });

    function renderClassSidebar() {
        classSidebarList.innerHTML = "";

        const classes = Array.from(new Set(rawStudents.map(s => s.class).filter(c => c)))
                             .sort((a, b) => a.localeCompare(b, 'zh-HK', { numeric: true }));

        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = `class-filter-btn ${currentClassFilter === 'ALL' ? 'active' : ''}`;
        allBtn.textContent = `全部 (${rawStudents.length})`;
        allBtn.onclick = () => {
            currentClassFilter = 'ALL';
            renderClassSidebar();
            renderRollCallTable();
            autoSave();
        };
        classSidebarList.appendChild(allBtn);

        classes.forEach(cName => {
            const count = rawStudents.filter(s => s.class === cName).length;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `class-filter-btn ${currentClassFilter === cName ? 'active' : ''}`;
            btn.textContent = `${cName} (${count})`;
            btn.onclick = () => {
                currentClassFilter = cName;
                renderClassSidebar();
                renderRollCallTable();
                autoSave();
            };
            classSidebarList.appendChild(btn);
        });
    }

    studentTableBody.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        const action = btn.dataset.action;
        const studentKey = btn.dataset.studentKey;

        if (action === 'set-status') {
            const status = btn.dataset.status;
            const selectedDate = dateSelect.value;
            if (selectedDate && studentKey) {
                attendanceMap[`${selectedDate}_${studentKey}`] = status;
                renderRollCallTable();
                autoSave();
            }
        } else if (action === 'toggle-fixed-day') {
            const dayNum = parseInt(btn.dataset.dayNum, 10);
            if (studentKey && !isNaN(dayNum)) {
                toggleStudentFixedAbsent(studentKey, dayNum);
            }
        } else if (action === 'edit-student') {
            const sIdx = rawStudents.findIndex(s => s.key === studentKey);
            if (sIdx > -1) openStudentModal(sIdx);
        }
    });

    function renderRollCallTable() {
        const selectedDate = dateSelect.value;
        if (!selectedDate) return;

        const wNum = getDayOfWeek(selectedDate);
        if (wNum !== -1) {
            weekdayTag.textContent = weekdays[wNum];
        }

        studentTableBody.innerHTML = "";

        const filteredStudents = currentClassFilter === 'ALL' 
            ? rawStudents 
            : rawStudents.filter(s => s.class === currentClassFilter);

        filteredStudents.forEach(student => {
            const currentStatus = attendanceMap[`${selectedDate}_${student.key}`] || "出席";
            const fixedDays = student.fixedAbsentDays || [];
            const tr = document.createElement('tr');

            const tdClass = document.createElement('td');
            tdClass.textContent = student.class;

            const tdId = document.createElement('td');
            tdId.textContent = student.studentId;

            const tdName = document.createElement('td');
            const strongName = document.createElement('strong');
            strongName.textContent = student.name;
            tdName.appendChild(strongName);

            const tdDismiss = document.createElement('td');
            const spanDismiss = document.createElement('span');
            let methodCls = 'tag-none';
            if (student.dismissMethod === '先行') methodCls = 'tag-walk';
            else if (student.dismissMethod === '家長') methodCls = 'tag-parent';
            else if (student.dismissMethod.includes('/')) methodCls = 'tag-both';
            
            spanDismiss.className = `tag-dismiss ${methodCls}`;
            spanDismiss.textContent = student.dismissMethod;
            tdDismiss.appendChild(spanDismiss);

            const tdStatus = document.createElement('td');
            const statusGroup = document.createElement('div');
            statusGroup.className = 'status-btn-group';

            const statusOptions = [
                { name: '出席', cls: 'active-present' },
                { name: '缺席', cls: 'active-absent' },
                { name: '請假', cls: 'active-leave' },
                { name: '遲到', cls: 'active-late' }
            ];

            statusOptions.forEach(opt => {
                const sBtn = document.createElement('button');
                sBtn.type = 'button';
                sBtn.className = `status-btn ${currentStatus === opt.name ? opt.cls : ''}`;
                sBtn.textContent = opt.name;
                sBtn.dataset.action = 'set-status';
                sBtn.dataset.studentKey = student.key;
                sBtn.dataset.status = opt.name;
                statusGroup.appendChild(sBtn);
            });
            tdStatus.appendChild(statusGroup);

            const tdFixed = document.createElement('td');
            const dayGroup = document.createElement('div');
            dayGroup.className = 'day-toggle-group';

            weekdayLabels.forEach(w => {
                const dayBtn = document.createElement('button');
                dayBtn.type = 'button';
                dayBtn.className = `day-btn ${fixedDays.includes(w.num) ? 'selected' : ''}`;
                dayBtn.textContent = w.label;
                dayBtn.dataset.action = 'toggle-fixed-day';
                dayBtn.dataset.studentKey = student.key;
                dayBtn.dataset.dayNum = w.num;
                dayGroup.appendChild(dayBtn);
            });
            tdFixed.appendChild(dayGroup);

            const tdAction = document.createElement('td');
            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'btn-edit';
            editBtn.textContent = '✏️ 編輯';
            editBtn.dataset.action = 'edit-student';
            editBtn.dataset.studentKey = student.key;
            tdAction.appendChild(editBtn);

            tr.appendChild(tdClass);
            tr.appendChild(tdId);
            tr.appendChild(tdName);
            tr.appendChild(tdDismiss);
            tr.appendChild(tdStatus);
            tr.appendChild(tdFixed);
            tr.appendChild(tdAction);

            studentTableBody.appendChild(tr);
        });
    }

    function toggleStudentFixedAbsent(studentKey, dayNum) {
        const student = rawStudents.find(s => s.key === studentKey);
        if (!student) return;

        if (!Array.isArray(student.fixedAbsentDays)) {
            student.fixedAbsentDays = [];
        }

        const idx = student.fixedAbsentDays.indexOf(dayNum);
        let isNowAdded = false;

        if (idx > -1) {
            student.fixedAbsentDays.splice(idx, 1);
            isNowAdded = false;
        } else {
            student.fixedAbsentDays.push(dayNum);
            isNowAdded = true;
        }

        dateList.forEach(d => {
            const wDay = getDayOfWeek(d);
            if (wDay === dayNum) {
                attendanceMap[`${d}_${studentKey}`] = isNowAdded ? "缺席" : "出席";
            }
        });

        renderRollCallTable();
        autoSave();
    }

    function openStudentModal(index = -1) {
        editingStudentIndex = index;
        const modal = document.getElementById('studentModal');
        const title = document.getElementById('modalTitle');
        const btnDelete = document.getElementById('btnDelete');

        if (index === -1) {
            title.textContent = "➕ 新增學生資料";
            btnDelete.style.display = "none";
            document.getElementById('modalClass').value = currentClassFilter !== 'ALL' ? currentClassFilter : "";
            document.getElementById('modalId').value = "";
            document.getElementById('modalName').value = "";
            document.getElementById('modalWalk').checked = false;
            document.getElementById('modalParent').checked = false;
        } else {
            title.textContent = "✏️ 編輯學生資料";
            btnDelete.style.display = "inline-block";
            const s = rawStudents[index];
            document.getElementById('modalClass').value = s.class;
            document.getElementById('modalId').value = s.studentId;
            document.getElementById('modalName').value = s.name;
            document.getElementById('modalWalk').checked = s.hasWalk;
            document.getElementById('modalParent').checked = s.hasParent;
        }
        modal.style.display = 'flex';
    }

    function closeStudentModal() {
        document.getElementById('studentModal').style.display = 'none';
    }

    function deleteStudent() {
        if (editingStudentIndex < 0 || editingStudentIndex >= rawStudents.length) return;
        
        const student = rawStudents[editingStudentIndex];
        if (confirm(`確定要刪除學生「${student.name}」(${student.class} 班 / ${student.studentId} 號) 嗎？\n此操作無法復原！`)) {
            // 清理考勤對應紀錄
            dateList.forEach(d => {
                delete attendanceMap[`${d}_${student.key}`];
            });

            // 從列表中移除
            rawStudents.splice(editingStudentIndex, 1);

            // 若目前篩選的班別已無學生，自動切換回全部
            if (currentClassFilter !== 'ALL' && !rawStudents.some(s => s.class === currentClassFilter)) {
                currentClassFilter = 'ALL';
            }

            closeStudentModal();
            renderClassSidebar();
            renderRollCallTable();
            studentCount.textContent = rawStudents.length;
            autoSave();
        }
    }

    function saveStudent() {
        const cVal = sanitizeStr(document.getElementById('modalClass').value);
        const idVal = sanitizeStr(document.getElementById('modalId').value);
        const nameVal = sanitizeStr(document.getElementById('modalName').value);
        const isWalk = document.getElementById('modalWalk').checked;
        const isParent = document.getElementById('modalParent').checked;

        if (!nameVal) {
            alert("請填寫學生姓名！");
            return;
        }

        const newKey = `${cVal}_${idVal}_${nameVal}`;

        let dismissType = "未註明";
        if (isWalk && isParent) dismissType = "先行/家長";
        else if (isWalk) dismissType = "先行";
        else if (isParent) dismissType = "家長";

        if (editingStudentIndex === -1) {
            if (rawStudents.some(s => s.key === newKey)) {
                alert("已存在相同班別、學號與姓名的學生！");
                return;
            }
            const newStudent = {
                key: newKey,
                class: cVal,
                studentId: idVal,
                name: nameVal,
                dismissMethod: dismissType,
                hasWalk: isWalk,
                hasParent: isParent,
                fixedAbsentDays: []
            };
            rawStudents.push(newStudent);
            dateList.forEach(d => {
                attendanceMap[`${d}_${newKey}`] = "出席";
            });
        } else {
            const oldStudent = rawStudents[editingStudentIndex];
            const oldKey = oldStudent.key;

            if (oldKey !== newKey) {
                dateList.forEach(d => {
                    if (attendanceMap[`${d}_${oldKey}`]) {
                        attendanceMap[`${d}_${newKey}`] = attendanceMap[`${d}_${oldKey}`];
                        delete attendanceMap[`${d}_${oldKey}`];
                    }
                });
            }

            oldStudent.key = newKey;
            oldStudent.class = cVal;
            oldStudent.studentId = idVal;
            oldStudent.name = nameVal;
            oldStudent.dismissMethod = dismissType;
            oldStudent.hasWalk = isWalk;
            oldStudent.hasParent = isParent;
        }

        sortStudents();
        closeStudentModal();
        renderClassSidebar();
        renderRollCallTable();
        studentCount.textContent = rawStudents.length;
        autoSave();
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm("確定要清除目前的資料並重新匯入檔案嗎？")) {
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            location.reload();
        }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        let aoaData = [];
        aoaData.push([]);
        aoaData.push([]);
        aoaData.push([activityName]);

        let headerRow = ["", "班別", "學號", "學生姓名", "", "先行", "家長", ""];
        dateList.forEach(d => headerRow.push(d));
        aoaData.push(headerRow);

        rawStudents.forEach(student => {
            const walkMark = student.hasWalk ? "✓" : "";
            const parentMark = student.hasParent ? "✓" : "";
            
            let row = ["", student.class, student.studentId, student.name, "", walkMark, parentMark, ""];
            dateList.forEach(d => {
                let status = attendanceMap[`${d}_${student.key}`] || "出席";
                row.push(status);
            });
            aoaData.push(row);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(aoaData);
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, worksheet, "點名紙");
        
        XLSX.writeFile(newWorkbook, `${activityName}_點名紙_${new Date().getTime()}.xlsx`);
    });
</script>
