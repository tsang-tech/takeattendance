<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能點名系統 (即時自動儲存版)</title>
    <!-- 引入 SheetJS 處理 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; }
        .control-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: #34495e; }
        select, input[type="file"], button { padding: 8px 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        
        .date-bar { display: flex; gap: 10px; align-items: center; background: #eef5ff; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .date-bar select { margin-bottom: 0; font-weight: bold; color: #0366d6; flex: 1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: white; }
        th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; color: #495057; }
        
        .student-select { padding: 4px; font-size: 13px; margin-bottom: 0; width: 100%; }

        /* 狀態按鈕組 */
        .status-btn-group { display: inline-flex; gap: 4px; }
        .status-btn { padding: 5px 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 0; width: auto; }
        .status-btn.active-present { background-color: #28a745; color: white; border-color: #28a745; font-weight: bold; }
        .status-btn.active-absent { background-color: #dc3545; color: white; border-color: #dc3545; font-weight: bold; }
        .status-btn.active-leave { background-color: #ffc107; color: #212529; border-color: #ffc107; font-weight: bold; }
        .status-btn.active-late { background-color: #17a2b8; color: white; border-color: #17a2b8; font-weight: bold; }

        .summary-info { font-size: 14px; color: #666; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .export-btn { background-color: #28a745; color: white; font-weight: bold; border: none; font-size: 16px; margin-top: 15px; cursor: pointer; padding: 12px; }
        .export-btn:hover { background-color: #218838; }
        .reset-btn { background-color: #6c757d; color: white; font-weight: bold; border: none; font-size: 13px; padding: 6px 12px; width: auto; margin-bottom: 0; cursor: pointer; }
        .reset-btn:hover { background-color: #5a6268; }
        .save-tag { font-size: 12px; color: #28a745; font-weight: bold; display: none; }
        .tips { color: #555; font-size: 13px; line-height: 1.5; background: #eef5ff; padding: 10px; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📝 智能點名系統</h1>
    
    <div class="control-group" id="uploadSection">
        <label for="excelFile">1. 匯入 Excel 點名紙 (可按住 Ctrl 同時選取多個檔案)：</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls" multiple>
        <div class="tips">
            💾 <b>即時自動儲存功能已啟用：</b> 任何點名修改都會自動儲存在此瀏覽器，重開網頁進度不會遺失。
        </div>
    </div>

    <!-- 點名工作區 -->
    <div id="appWorkspace" style="display: none;">
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <div class="control-group">
            <label>2. 選擇訓練日期進行點名：</label>
            <div class="date-bar">
                <select id="dateSelect"></select>
                <span id="weekdayTag" style="font-weight: bold; color: #555; min-width: 70px;"></span>
            </div>
        </div>

        <div class="summary-info">
            <div>訓練項目：<strong id="activityDisplay" style="color:#0366d6;">-</strong> | 學生總數：<strong id="studentCount">0</strong> 人</div>
            <div>
                <span id="saveStatus" class="save-tag">✓ 已自動儲存</span>
                <button class="reset-btn" id="resetBtn">清除資料 / 重新匯入</button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">班別</th>
                        <th style="width: 10%;">學號</th>
                        <th style="width: 18%;">學生姓名</th>
                        <th style="width: 27%;">個人固定缺席日</th>
                        <th style="width: 35%;">當日點名狀態</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>

        <button class="export-btn" id="exportBtn">匯出完整點名結果 (Excel)</button>
    </div>
</div>

<script>
    let rawStudents = [];     // 學生名單
    let dateList = [];        // 日期清單
    let activityName = "";    // 活動名稱
    let attendanceMap = {};   // 點名紀錄 map

    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const LOCAL_STORAGE_KEY = "SMART_ROLLCALL_DATA";

    const excelFileInput = document.getElementById('excelFile');
    const appWorkspace = document.getElementById('appWorkspace');
    const dateSelect = document.getElementById('dateSelect');
    const weekdayTag = document.getElementById('weekdayTag');
    const studentTableBody = document.getElementById('studentTableBody');
    const activityDisplay = document.getElementById('activityDisplay');
    const studentCount = document.getElementById('studentCount');
    const saveStatus = document.getElementById('saveStatus');

    // 頁面載入時檢查是否有舊紀錄
    window.addEventListener('DOMContentLoaded', () => {
        loadDataFromStorage();
    });

    // 儲存至 LocalStorage
    function autoSave() {
        const storeObj = {
            rawStudents,
            dateList,
            activityName,
            attendanceMap,
            selectedDate: dateSelect.value
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(storeObj));
        
        // 顯示已儲存提示
        saveStatus.style.display = "inline";
        setTimeout(() => { saveStatus.style.display = "none"; }, 1500);
    }

    // 從 LocalStorage 載入資料
    function loadDataFromStorage() {
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!saved) return;

        try {
            const data = JSON.parse(saved);
            rawStudents = data.rawStudents || [];
            dateList = data.dateList || [];
            activityName = data.activityName || "";
            attendanceMap = data.attendanceMap || {};

            if (rawStudents.length > 0 && dateList.length > 0) {
                activityDisplay.textContent = activityName;
                studentCount.textContent = rawStudents.length;

                // 重新渲染日期選單
                dateSelect.innerHTML = "";
                dateList.forEach((d, idx) => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    const dObj = new Date(d);
                    const wStr = !isNaN(dObj) ? weekdays[dObj.getDay()] : "";
                    opt.textContent = `第 ${idx + 1} 節：${d} (${wStr})`;
                    dateSelect.appendChild(opt);
                });

                if (data.selectedDate) {
                    dateSelect.value = data.selectedDate;
                }

                appWorkspace.style.display = 'block';
                renderRollCallTable();
            }
        } catch(e) {
            console.error("載入舊資料失敗:", e);
        }
    }

    // 讀取 Excel 檔案
    excelFileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        let allDatesSet = new Set();
        let studentMap = new Map();
        let primaryActivityName = "";

        const readPromises = files.map((file, index) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const aoa = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});

                    if (index === 0) {
                        primaryActivityName = (aoa[2] && aoa[2][0]) ? aoa[2][0] : "訓練活動";
                    }

                    const dateRow = aoa[3] || [];
                    for (let col = 8; col < dateRow.length; col++) {
                        if (dateRow[col] && dateRow[col].toString().trim() !== "") {
                            allDatesSet.add(dateRow[col].toString().trim());
                        }
                    }

                    for (let r = 4; r < aoa.length; r++) {
                        if (aoa[r] && aoa[r][3]) {
                            const sName = aoa[r][3].toString().trim();
                            if (sName && !studentMap.has(sName)) {
                                studentMap.set(sName, {
                                    class: aoa[r][1] || "",
                                    studentId: aoa[r][2] || "",
                                    name: sName,
                                    fixedAbsentDay: -1
                                });
                            }
                        }
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        });

        Promise.all(readPromises).then(() => {
            activityName = primaryActivityName;
            activityDisplay.textContent = activityName;

            dateList = Array.from(allDatesSet).sort((a, b) => new Date(a) - new Date(b));
            rawStudents = Array.from(studentMap.values());
            studentCount.textContent = rawStudents.length;

            attendanceMap = {};
            dateList.forEach(d => {
                rawStudents.forEach(s => {
                    attendanceMap[`${d}_${s.name}`] = "出席";
                });
            });

            dateSelect.innerHTML = "";
            dateList.forEach((d, idx) => {
                const opt = document.createElement('option');
                opt.value = d;
                const dObj = new Date(d);
                const wStr = !isNaN(dObj) ? weekdays[dObj.getDay()] : "";
                opt.textContent = `第 ${idx + 1} 節：${d} (${wStr})`;
                dateSelect.appendChild(opt);
            });

            appWorkspace.style.display = 'block';
            renderRollCallTable();
            autoSave(); // 初次匯入自動存檔
        });
    });

    dateSelect.addEventListener('change', () => {
        renderRollCallTable();
        autoSave();
    });

    // 渲染表格
    function renderRollCallTable() {
        const selectedDate = dateSelect.value;
        if (!selectedDate) return;

        const dObj = new Date(selectedDate);
        if (!isNaN(dObj)) {
            weekdayTag.textContent = weekdays[dObj.getDay()];
        }

        studentTableBody.innerHTML = "";

        rawStudents.forEach(student => {
            const currentStatus = attendanceMap[`${selectedDate}_${student.name}`] || "出席";
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${student.class}</td>
                <td>${student.studentId}</td>
                <td><strong>${student.name}</strong></td>
                <td>
                    <select class="student-select" onchange="updateStudentFixedAbsent('${student.name}', this.value)">
                        <option value="-1" ${student.fixedAbsentDay === -1 ? 'selected' : ''}>無固定缺席</option>
                        <option value="1" ${student.fixedAbsentDay === 1 ? 'selected' : ''}>逢星期一缺席</option>
                        <option value="2" ${student.fixedAbsentDay === 2 ? 'selected' : ''}>逢星期二缺席</option>
                        <option value="3" ${student.fixedAbsentDay === 3 ? 'selected' : ''}>逢星期三缺席</option>
                        <option value="4" ${student.fixedAbsentDay === 4 ? 'selected' : ''}>逢星期四缺席</option>
                        <option value="5" ${student.fixedAbsentDay === 5 ? 'selected' : ''}>逢星期五缺席</option>
                        <option value="6" ${student.fixedAbsentDay === 6 ? 'selected' : ''}>逢星期六缺席</option>
                        <option value="0" ${student.fixedAbsentDay === 0 ? 'selected' : ''}>逢星期日缺席</option>
                    </select>
                </td>
                <td>
                    <div class="status-btn-group">
                        <button class="status-btn ${currentStatus === '出席' ? 'active-present' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '出席')">出席</button>
                        <button class="status-btn ${currentStatus === '缺席' ? 'active-absent' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '缺席')">缺席</button>
                        <button class="status-btn ${currentStatus === '請假' ? 'active-leave' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '請假')">請假</button>
                        <button class="status-btn ${currentStatus === '遲到' ? 'active-late' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '遲到')">遲到</button>
                    </div>
                </td>
            `;
            studentTableBody.appendChild(tr);
        });
    }

    // 更新個人固定缺席日
    window.updateStudentFixedAbsent = function(studentName, absentDayStr) {
        const absentDay = parseInt(absentDayStr);
        const student = rawStudents.find(s => s.name === studentName);
        if (student) {
            student.fixedAbsentDay = absentDay;
        }

        dateList.forEach(d => {
            const dObj = new Date(d);
            if (!isNaN(dObj) && dObj.getDay() === absentDay) {
                attendanceMap[`${d}_${studentName}`] = "缺席";
            }
        });

        renderRollCallTable();
        autoSave();
    };

    // 手動變更點名狀態
    window.setStatus = function(date, studentName, status) {
        attendanceMap[`${date}_${studentName}`] = status;
        renderRollCallTable();
        autoSave();
    };

    // 清除資料 / 重新匯入
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm("確定要清除目前儲存的點名紀錄並重新匯入檔案嗎？")) {
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            location.reload();
        }
    });

    // 匯出完整 Excel
    document.getElementById('exportBtn').addEventListener('click', () => {
        let exportData = [];

        rawStudents.forEach(student => {
            dateList.forEach(d => {
                const dObj = new Date(d);
                const wStr = !isNaN(dObj) ? weekdays[dObj.getDay()] : "";
                
                exportData.push({
                    "班別": student.class,
                    "學號": student.studentId,
                    "學生姓名": student.name,
                    "訓練項目": activityName,
                    "訓練日期": d,
                    "星期": wStr,
                    "狀態": attendanceMap[`${d}_${student.name}`] || "出席"
                });
            });
        });

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, worksheet, "點名總表");
        
        XLSX.writeFile(newWorkbook, `${activityName}_點名紀錄_${new Date().getTime()}.xlsx`);
    });
</script>

</body>
</html>
