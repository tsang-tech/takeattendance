<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日互動點名系統</title>
    <!-- 引入 SheetJS 處理 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 950px; margin: 0 auto; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; }
        .control-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: #34495e; }
        select, input[type="file"], button { padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        
        .date-bar { display: flex; gap: 10px; align-items: center; background: #eef5ff; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .date-bar select { margin-bottom: 0; font-weight: bold; color: #0366d6; flex: 1; }
        
        .quick-actions { display: flex; gap: 10px; margin-bottom: 15px; }
        .quick-actions button { margin-bottom: 0; cursor: pointer; font-size: 13px; font-weight: bold; border: none; color: white; }
        .btn-all-present { background-color: #28a745; }
        .btn-apply-rule { background-color: #17a2b8; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: white; }
        th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; color: #495057; }
        
        /* 狀態按鈕組 */
        .status-btn-group { display: inline-flex; gap: 4px; }
        .status-btn { padding: 6px 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 0; width: auto; }
        .status-btn.active-present { background-color: #28a745; color: white; border-color: #28a745; font-weight: bold; }
        .status-btn.active-absent { background-color: #dc3545; color: white; border-color: #dc3545; font-weight: bold; }
        .status-btn.active-leave { background-color: #ffc107; color: #212529; border-color: #ffc107; font-weight: bold; }
        .status-btn.active-late { background-color: #17a2b8; color: white; border-color: #17a2b8; font-weight: bold; }

        .summary-info { font-size: 14px; color: #666; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .export-btn { background-color: #28a745; color: white; font-weight: bold; border: none; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .export-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h1>📝 每日互動點名系統</h1>
    
    <div class="control-group">
        <label for="excelFile">1. 匯入 Excel 點名紙：</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <!-- 點名工作區 (讀取檔案後顯示) -->
    <div id="appWorkspace" style="display: none;">
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <div class="control-group">
            <label>2. 選擇訓練日期進行點名：</label>
            <div class="date-bar">
                <select id="dateSelect"></select>
                <span id="weekdayTag" style="font-weight: bold; color: #555; min-width: 70px;"></span>
            </div>
        </div>

        <div class="control-group">
            <label>快速設定：</label>
            <div class="quick-actions">
                <button class="btn-all-present" id="btnAllPresent">全日預設為「出席」</button>
                <button class="btn-apply-rule" id="btnApplyRule">按星期幾自動標記「缺席」</button>
            </div>
        </div>

        <div class="summary-info">
            <span>訓練項目：<strong id="activityDisplay" style="color:#0366d6;">-</strong></span>
            <span>總人數：<strong id="studentCount">0</strong> 人</span>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>班別</th>
                        <th>學號</th>
                        <th>學生姓名</th>
                        <th>點名狀態</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>

        <button class="export-btn" id="exportBtn">匯出完整點名結果 (Excel)</button>
    </div>
</div>

<script>
    let rawStudents = [];     // 學生名單 [{class, studentId, name}]
    let dateList = [];        // 日期清單 ["2026-09-01", ...]
    let activityName = "";    // 活動名稱
    let attendanceMap = {};   // 記錄所有人日常點名: { "日期_姓名": "出席" | "缺席" | "請假" | "遲到" }

    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    const excelFileInput = document.getElementById('excelFile');
    const appWorkspace = document.getElementById('appWorkspace');
    const dateSelect = document.getElementById('dateSelect');
    const weekdayTag = document.getElementById('weekdayTag');
    const studentTableBody = document.getElementById('studentTableBody');
    const activityDisplay = document.getElementById('activityDisplay');
    const studentCount = document.getElementById('studentCount');

    // 匯入 Excel 檔案
    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd'});

            // 1. 活動名稱 (A3)
            activityName = (aoa[2] && aoa[2][0]) ? aoa[2][0] : "訓練活動";
            activityDisplay.textContent = activityName;

            // 2. 訓練日期 (I4 至 CD4)
            dateList = [];
            const dateRow = aoa[3] || [];
            for (let col = 8; col < dateRow.length; col++) {
                if (dateRow[col]) dateList.push(dateRow[col]);
            }

            // 3. 學生名單 (B5:班別, C5:學號, D5:姓名)
            rawStudents = [];
            for (let r = 4; r < aoa.length; r++) {
                if (aoa[r] && aoa[r][3]) {
                    rawStudents.push({
                        class: aoa[r][1] || "",
                        studentId: aoa[r][2] || "",
                        name: aoa[r][3]
                    });
                }
            }

            studentCount.textContent = rawStudents.length;

            // 初始化所有日期的預設狀態為「出席」
            attendanceMap = {};
            dateList.forEach(d => {
                rawStudents.forEach(s => {
                    attendanceMap[`${d}_${s.name}`] = "出席";
                });
            });

            // 渲染日期下拉選單
            dateSelect.innerHTML = "";
            dateList.forEach((d, idx) => {
                const opt = document.createElement('option');
                opt.value = d;
                const dObj = new Date(d);
                const wStr = !isNaN(dObj) ? weekdays[dObj.getDay()] : "";
                opt.textContent = `第 ${idx + 1} 節：${d} (${wStr})`;
                dateSelect.appendChild(opt);
            });

            appWorkspace.style.display = 'block';
            renderRollCallTable();
        };
        reader.readAsArrayBuffer(file);
    });

    // 日期切換事件
    dateSelect.addEventListener('change', renderRollCallTable);

    // 渲染特定日期的點名表格
    function renderRollCallTable() {
        const selectedDate = dateSelect.value;
        if (!selectedDate) return;

        const dObj = new Date(selectedDate);
        if (!isNaN(dObj)) {
            weekdayTag.textContent = weekdays[dObj.getDay()];
        }

        studentTableBody.innerHTML = "";

        rawStudents.forEach(student => {
            const currentStatus = attendanceMap[`${selectedDate}_${student.name}`] || "出席";
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${student.class}</td>
                <td>${student.studentId}</td>
                <td><strong>${student.name}</strong></td>
                <td>
                    <div class="status-btn-group">
                        <button class="status-btn ${currentStatus === '出席' ? 'active-present' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '出席')">出席</button>
                        <button class="status-btn ${currentStatus === '缺席' ? 'active-absent' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '缺席')">缺席</button>
                        <button class="status-btn ${currentStatus === '請假' ? 'active-leave' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '請假')">請假</button>
                        <button class="status-btn ${currentStatus === '遲到' ? 'active-late' : ''}" onclick="setStatus('${selectedDate}', '${student.name}', '遲到')">遲到</button>
                    </div>
                </td>
            `;
            studentTableBody.appendChild(tr);
        });
    }

    // 修改特定學生點名狀態
    window.setStatus = function(date, studentName, status) {
        attendanceMap[`${date}_${studentName}`] = status;
        renderRollCallTable();
    };

    // 快速功能：全日設為出席
    document.getElementById('btnAllPresent').addEventListener('click', () => {
        const selectedDate = dateSelect.value;
        rawStudents.forEach(s => {
            attendanceMap[`${selectedDate}_${s.name}`] = "出席";
        });
        renderRollCallTable();
    });

    // 快速功能：逢星期幾設定缺席
    document.getElementById('btnApplyRule').addEventListener('click', () => {
        const dayInput = prompt("請輸入固定缺席的星期幾數字：\n1 = 星期一\n2 = 星期二\n3 = 星期三\n4 = 星期四\n5 = 星期五\n6 = 星期六\n0 = 星期日");
        if (dayInput === null) return;
        
        const targetDay = parseInt(dayInput);
        if (isNaN(targetDay) || targetDay < 0 || targetDay > 6) {
            alert("請輸入有效的數字 (0 至 6)");
            return;
        }

        dateList.forEach(d => {
            const dObj = new Date(d);
            if (!isNaN(dObj) && dObj.getDay() === targetDay) {
                rawStudents.forEach(s => {
                    attendanceMap[`${d}_${s.name}`] = "缺席";
                });
            }
        });

        alert(`已完成將所有 ${weekdays[targetDay]} 設定為缺席！`);
        renderRollCallTable();
    });

    // 匯出完整 Excel 檔案
    document.getElementById('exportBtn').addEventListener('click', () => {
        let exportData = [];

        rawStudents.forEach(student => {
            dateList.forEach(d => {
                const dObj = new Date(d);
                const wStr = !isNaN(dObj) ? weekdays[dObj.getDay()] : "";
                
                exportData.push({
                    "班別": student.class,
                    "學號": student.studentId,
                    "學生姓名": student.name,
                    "訓練項目": activityName,
                    "訓練日期": d,
                    "星期": wStr,
                    "狀態": attendanceMap[`${d}_${student.name}`] || "出席"
                });
            });
        });

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, worksheet, "點名總表");
        
        XLSX.writeFile(newWorkbook, `${activityName}_點名紀錄_${new Date().getTime()}.xlsx`);
    });
</script>

</body>
</html>
